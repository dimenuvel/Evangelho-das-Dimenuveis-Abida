name: Build Android APK (Capacitor)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug
          - release

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 21 required for modern Gradle & Android SDKs)
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 3: Set up Android SDK & Build Tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Set up Node.js environment
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Step 5: Install Node & Capacitor Dependencies
      - name: Install Dependencies
        run: npm ci || npm install

      # Step 6: Build Web Assets (Vite -> dist)
      - name: Build Web Application
        run: npm run build

      # Step 7: Initialize & Sync Capacitor Android Platform
      - name: Prepare Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding Capacitor Android platform..."
            npx cap add android
          fi
          echo "Syncing web assets to Capacitor Android project..."
          npx cap sync android

      # Step 8: Set up Gradle Cache for Fast Builds
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 9: Make Gradle Wrapper Executable
      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          chmod +x gradlew

      # Step 10: Clean previous build outputs (avoids stale/corrupted cache issues)
      - name: Clean Gradle build
        run: |
          cd android
          ./gradlew clean --no-daemon

      # Step 11: Build Debug APK
      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'all' || github.event_name != 'workflow_dispatch' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 12: Build Release APK (Unsigned)
      - name: Build Android Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'all' || github.event_name != 'workflow_dispatch' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      # Step 13: Organize and Zip Output APK
      - name: Organize APK Artifact
        run: |
          mkdir -p build-output
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "build-output/Abida-O-Jogo.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "build-output/Abida-O-Jogo.apk"
          else
            echo "No APK found!" && exit 1
          fi
          cd build-output
          zip Abida-O-Jogo.zip Abida-O-Jogo.apk

      # Step 14: Upload Zipped APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abida-O-Jogo
          path: build-output/Abida-O-Jogo.zip
          retention-days: 14

      # Step 15: Attach Zipped APK to GitHub Release if a tag was pushed
      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/Abida-O-Jogo.zip
          draft: false
          prerelease: false
          generate_release_notes: true
